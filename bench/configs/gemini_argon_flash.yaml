# Benchmark config: Gemini 4 Argon (strong, high thinking) and Gemini 3.8 Flash (fast, low thinking), Jev on OpenRouter.
listen: {host: 0.0.0.0, port: 8787}
log_dir: runs/proxy
budget_usd: null
log_states: true              # keep the decision model's input states (states.jsonl; holds task text)

upstreams:
  gemini: {type: gemini, base_url: "https://generativelanguage.googleapis.com/v1beta", key_env: GEMINI_API_KEY,
           retries: 4, timeout_s: 900}

tiers:
  strong: {upstream: gemini, model: gemini-4-argon, effort: high}
  fast:   {upstream: gemini, model: gemini-3.8-flash, effort: low, cache: explicit}
  fast_med: {upstream: gemini, model: gemini-3.8-flash, effort: medium, cache: explicit}
  strong_low: {upstream: gemini, model: gemini-4-argon, effort: low}      # effort routing: same model, little thinking

router:
  decision: {type: jev, provider: openrouter}
  tau: 0.5
  first_steps_strong: 1
  stick_strong: 0
  max_fast_streak: 0
  verify_finish: true
  on_error: strong
  decision_timeout_s: 8

models:
  jah-auto: {policy: route}
  jah-auto-t75: {policy: route, tau: 0.75}
  jah-auto-t85: {policy: route, tau: 0.85}
  jah-auto-t75m: {policy: route, tau: 0.75, fast: fast_med}
  jah-auto-eff: {policy: route, fast: strong_low}
  jah-strong: {tier: strong}
  jah-fast: {tier: fast}
default_model: jah-auto
