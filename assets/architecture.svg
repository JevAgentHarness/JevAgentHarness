<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="title desc">
  <title id="title">JevAgentHarness architecture</title>
  <desc id="desc">An unmodified agent harness (Codex CLI, pi, DeepSeek Harness, mini-swe-agent, Terminus-2) sends every step to the JevAgentHarness proxy through the OpenAI-compatible API. The proxy keeps per-session state, asks a small decision model whether the next step is routine or hard, and applies router rules (first step strong, finish check, fail-safe). Hard steps go to the strong model and routine steps to the fast model. Every step is logged with tier, tokens, cost and latency, and jah report summarises the logs.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <marker id="ah-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6e4ff6"/>
    </marker>
    <marker id="ah-fast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0d9488"/>
    </marker>
    <marker id="ah-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c27c0e"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#1f2328">
    <!-- light panel: keeps the diagram legible on GitHub's light and dark themes -->
    <rect x="1" y="1" width="1198" height="588" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

    <!-- ===== Agent harness ===== -->
    <rect x="30" y="108" width="200" height="300" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <text x="130" y="141" text-anchor="middle" font-size="19" font-weight="700">Agent harness</text>
    <text x="130" y="163" text-anchor="middle" font-size="14" fill="#59636e">unchanged</text>
    <g font-size="15.5" text-anchor="middle">
      <rect x="48" y="180" width="164" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="130" y="202">Codex CLI</text>
      <rect x="48" y="222" width="164" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="130" y="244">pi</text>
      <rect x="48" y="264" width="164" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="130" y="286">DeepSeek Harness</text>
      <rect x="48" y="306" width="164" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="130" y="328">mini-swe-agent</text>
      <rect x="48" y="348" width="164" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="130" y="370">Terminus-2</text>
    </g>

    <!-- ===== API arrow (request and reply) ===== -->
    <line x1="236" y1="258" x2="424" y2="258" stroke="#57606a" stroke-width="2.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="330" y="222" text-anchor="middle" font-size="15" font-weight="700">OpenAI-compatible</text>
    <text x="330" y="242" text-anchor="middle" font-size="15" font-weight="700">API</text>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" text-anchor="middle" fill="#1f2328">
      <text x="330" y="281">/v1/chat/completions</text>
      <text x="330" y="300">/v1/responses</text>
    </g>
    <text x="330" y="324" text-anchor="middle" font-size="13.5" fill="#59636e">every agent step</text>

    <!-- ===== Proxy ===== -->
    <rect x="430" y="36" width="452" height="392" rx="16" fill="#f5f3ff" stroke="#7c5cff" stroke-width="2.2"/>
    <text x="452" y="71" font-size="20" font-weight="700">JevAgentHarness proxy</text>
    <text x="452" y="93" font-size="14" fill="#59636e">runs locally · holds the API keys</text>

    <!-- per-session state -->
    <rect x="452" y="112" width="200" height="92" rx="10" fill="#ffffff" stroke="#c4b8ff" stroke-width="1.6"/>
    <text x="470" y="140" font-size="16" font-weight="700">Per-session state</text>
    <text x="470" y="164" font-size="14" fill="#59636e">task, recent actions,</text>
    <text x="470" y="184" font-size="14" fill="#59636e">last tool output</text>

    <line x1="552" y1="206" x2="552" y2="238" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>

    <!-- decision model -->
    <rect x="452" y="242" width="200" height="164" rx="10" fill="#fff6e3" stroke="#f5a524" stroke-width="2"/>
    <text x="470" y="270" font-size="16" font-weight="700">Decision model</text>
    <text x="470" y="298" font-size="15.5" font-style="italic">“Is the next step</text>
    <text x="470" y="319" font-size="15.5" font-style="italic">routine or hard?”</text>
    <text x="470" y="352" font-size="14" fill="#59636e">Jev: ~0.15 s and</text>
    <text x="470" y="372" font-size="14" fill="#59636e">~$0.0001 per call</text>
    <text x="470" y="392" font-size="14" fill="#59636e">→ p(hard)</text>

    <line x1="654" y1="324" x2="692" y2="324" stroke="#c27c0e" stroke-width="2" marker-end="url(#ah-gate)"/>

    <!-- router rules -->
    <rect x="696" y="112" width="166" height="294" rx="10" fill="#ffffff" stroke="#c4b8ff" stroke-width="1.6"/>
    <text x="712" y="140" font-size="16" font-weight="700">Router rules</text>
    <g font-size="14">
      <text x="712" y="170" font-weight="700">First step</text>
      <text x="712" y="189" fill="#59636e">→ strong</text>
      <text x="712" y="223" font-weight="700">p(hard) ≥ τ</text>
      <text x="712" y="242" fill="#59636e">→ strong, else fast</text>
      <text x="712" y="276" font-weight="700">Finish check</text>
      <text x="712" y="295" fill="#59636e">fast wants to stop:</text>
      <text x="712" y="314" fill="#59636e">strong redoes it</text>
      <text x="712" y="348" font-weight="700">Fail-safe</text>
      <text x="712" y="367" fill="#59636e">any error → strong</text>
    </g>

    <!-- ===== Model tiers ===== -->
    <line x1="864" y1="176" x2="944" y2="176" stroke="#6e4ff6" stroke-width="2.4" marker-end="url(#ah-strong)"/>
    <text x="916" y="166" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b3fd9">hard</text>
    <line x1="864" y1="342" x2="944" y2="342" stroke="#0d9488" stroke-width="2.4" marker-end="url(#ah-fast)"/>
    <text x="916" y="332" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f766e">routine</text>

    <rect x="950" y="112" width="220" height="128" rx="14" fill="#efeaff" stroke="#7c5cff" stroke-width="2.2"/>
    <text x="968" y="143" font-size="18" font-weight="700" fill="#4c32c7">Strong model</text>
    <text x="968" y="168" font-size="14">planning, debugging,</text>
    <text x="968" y="187" font-size="14">deciding it is done</text>
    <text x="968" y="214" font-size="13.5" fill="#59636e">e.g. Gemini 4 Argon,</text>
    <text x="968" y="231" font-size="13.5" fill="#59636e">GPT-6.1 Sol</text>

    <rect x="950" y="278" width="220" height="128" rx="14" fill="#e3f6f2" stroke="#14b8a6" stroke-width="2.2"/>
    <text x="968" y="309" font-size="18" font-weight="700" fill="#0f766e">Fast model</text>
    <text x="968" y="334" font-size="14">read, search, run,</text>
    <text x="968" y="353" font-size="14">planned edits</text>
    <text x="968" y="380" font-size="13.5" fill="#59636e">e.g. Gemini 3.5 Flash-Lite,</text>
    <text x="968" y="397" font-size="13.5" fill="#59636e">GPT-6 Luna</text>

    <!-- finish check / fail-safe: fast -> strong -->
    <line x1="1140" y1="276" x2="1140" y2="244" stroke="#6e4ff6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-strong)"/>
    <text x="1130" y="264" text-anchor="end" font-size="13" font-style="italic" fill="#5b3fd9">finish check, errors</text>

    <!-- ===== Model names the harness can ask for ===== -->
    <rect x="30" y="470" width="372" height="96" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="50" y="500" font-size="15" font-weight="700">Model name set in the harness</text>
    <g font-size="14">
      <text x="50" y="526"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">jah-auto</tspan><tspan fill="#59636e" dx="10">routed step by step</tspan></text>
      <text x="50" y="550"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">jah-strong</tspan><tspan fill="#59636e" dx="6">or</tspan><tspan dx="6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">jah-fast</tspan><tspan fill="#59636e" dx="10">one tier (baseline)</tspan></text>
    </g>

    <!-- ===== Logs and report ===== -->
    <line x1="656" y1="430" x2="656" y2="466" stroke="#57606a" stroke-width="2" marker-end="url(#ah)"/>
    <text x="668" y="453" font-size="13.5" fill="#59636e">every step</text>

    <rect x="430" y="470" width="740" height="96" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <text x="452" y="510" font-size="16" font-weight="700">Logs and report</text>
    <text x="452" y="532" font-size="13.5" fill="#59636e">no prompt text logged</text>
    <g font-size="14">
      <rect x="636" y="482" width="112" height="30" rx="7" fill="#ffffff" stroke="#d0d7de"/>
      <text x="692" y="502" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">steps.jsonl</text>
      <text x="760" y="502">one line per step: tier, tokens, cost, latency</text>
      <rect x="636" y="524" width="112" height="30" rx="7" fill="#ffffff" stroke="#d0d7de"/>
      <text x="692" y="544" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">jah report</text>
      <text x="760" y="544">per-model summary: strong share, cost, time</text>
    </g>
  </g>
</svg>
