  # is charged twice; the descriptive StartLux rows therefore report API cost only (stated with them).
  StartLux-Decision-4B:          {input_per_m: 0.0, output_per_m: 0.0}
  StartLux-Decision-27B:         {input_per_m: 0.0, output_per_m: 0.0}
  # the size ladder's live rows (exploratory E2, PREREG_A7_STAGE2 Deviations 2026-10-05): API cost only, as above
