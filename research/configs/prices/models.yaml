# USD per 1M tokens. !!! VERIFY every number against the provider's pricing page before the
# paper's cost tables are finalised (prices change; entries marked `verify` are from memory).
# Lookup is by exact model id, then by a suffix match on whole path segments (so "openrouter/qwen/qwen3-8b" matches
# "qwen/qwen3-8b" and "deepseek-chat" matches "deepseek/deepseek-chat", but a bare "flash" matches nothing).
models:
  # ---- System-1 decision models --------------------------------------------------------
  jev-latest:        {input_per_m: 0.042, output_per_m: 0.0}   # TypeSafe docs: $0.042/M input, output free
  jev-preview:       {input_per_m: 0.042, output_per_m: 0.0}
  jev-1.13.0:        {input_per_m: 0.042, output_per_m: 0.0}
  # self-hosted OpenJev: amortised GPU cost. Example: 1x H100 @ $2.50/h serving ~10 req/s at
  # ~1.5k input tokens/req -> ~$0.046/M. Recompute with your measured throughput (scripts/measure_openjev.py).
  openjev-selfhost:  {input_per_m: 0.046, output_per_m: 0.0}
  openjev-latest:    {input_per_m: 0.046, output_per_m: 0.0}
  codiv-openjev:     {input_per_m: 0.0, output_per_m: 0.0}      # free hosted OpenJev endpoint (100M tokens)
  # self-hosted Intern-Decision (in-process `{type: intern_decision}`): ASSUMED amortised GPU cost, same method as
  # openjev-selfhost. 1x RTX 4090 @ $0.40/h (verify) at the model card's unbatched end-to-end latency on that GPU
  # (0.8B 34 ms, 2B 33 ms, 4B 44 ms per query -> 29 / 30 / 23 req/s) and ~500 input tokens/query:
  # $/h / (req/s * 3600 * tok/req) * 1e6 = 0.0077 / 0.0074 / 0.0098 $/M. Output tokens = scored fields, free.
  # RECOMPUTE from measured throughput (scripts/bench_serving.py) before any cost table; batching lowers it further.
  internlm/Intern-Decision-0.8B: {input_per_m: 0.008, output_per_m: 0.0}   # assumption, see above
  internlm/Intern-Decision-2B:   {input_per_m: 0.008, output_per_m: 0.0}   # assumption, see above
  internlm/Intern-Decision-4B:   {input_per_m: 0.010, output_per_m: 0.0}   # assumption, see above
