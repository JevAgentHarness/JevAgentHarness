# E6a smoke (development only; cost projection): the eval arms on the first 2 games (stratified order) of the 48
# calibration TRAIN games. Never valid_seen. The CASCADE tau is the fitted one (copied from eval.yaml).
#   python -m jevharness.bench.runner configs/explore/e6a_alfworld/smoke.yaml --out runs
name: e6a_alfworld_smoke
suite: {name: alfworld, split: train, data_dir: data/raw/alfworld_e6a, n: 2, stratify: true, max_episode_steps: 50}
n_tasks: 2
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
s1: {type: jev, provider: openrouter}
harness_defaults: {max_steps: 50, history_window: 12}
workers: 8
schedule: {mode: task_major, seed: 732}
arms:
  - {name: llm_only}
  - {name: jev_action_replace, action: {mode: replace}}
  - {name: jev_action_cascade_tauhat, action: {mode: cascade, tau: 0.95}}
  - {name: jev_action_assist_k3, action: {mode: assist, k: 3}}
