# Exploratory row E12c (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-07 "E12c: the recipe on a stronger base, and
# same-engine serving cost"; descriptive, outside every Holm table): E1's 3,991 static decisions answered by
# StartLux-4B (mixed), the E12 mixture + the SFT v1 recipe on StartLux-Decision-4B (CC BY-NC 4.0), served by
# training/serve_jev.py in the v2 venv on the E12c host. E1's config (configs/decision/bfcl_when2call_rl.yaml) with the
# same pools, exclusions (C8 population), batching and workers; a new answer cache.
#   python -m jevharness.bench.decision_eval configs/explore/e12_train/e1_e12c.yaml --out runs --only e12c_sl4b
name: e1_bfcl_when2call_e12c
suites:
  - {name: bfcl, categories: [simple_python, multiple, live_simple, live_multiple, irrelevance, live_irrelevance], max_per_cat: 200}
  - {name: when2call, max_items: 1000}
exclude_ids_file: configs/eval/e1_dev_prefix_ids.json   # A6.13: as E1
batch_by_state: true
s1_cache: cache/s1_e12c_e1.sqlite
workers: 4
backends:
  e12c_sl4b: {type: jev, name: startlux-4b-mixed, base_url: "http://localhost:8081", model: startlux-4b-mixed, api_key: "",
              price_model: StartLux-Decision-4B}   # an exact 0 per token (configs/prices): GPU time is priced by E9's rule
