# E6d routing repair (docs/PREREG_A7_STAGE2.md, Deviations addendum 2026-10-06 ~16:55 UTC). On the OpenRouter route,
# Gemini 3.5 Flash-Lite returned empty replies (neither text nor a tool call) in about 73 % of the routing episodes,
# the plain Flash-Lite reference included, so the two routing cells could not be compared. The routing trio runs again
# with every Flash-Lite call on the direct Gemini API (healthy again; as E6b) and the Flash calls of escalated steps
# on OpenRouter (the direct Flash API is still overloaded; no empty replies there), on fresh JevGym seeds
# 301200..301399 (unused: checked), the same suite settings, task-major (seed 732), 24 workers, the same $120 cap.
name: e6d_modes_routing
suite: {name: jevgym, n: 200, seed0: 301200, families: v2, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}
n_tasks: 200
llm: {provider: openrouter, model: google/gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}   # escalated steps
small_llm: {provider: gemini, model: gemini-3.5-flash-lite, temperature: 0, reasoning_effort: minimal}   # the routing agent
llms:
  lite: {provider: gemini, model: gemini-3.5-flash-lite, temperature: 0, reasoning_effort: minimal}
s1: {type: jev, provider: openrouter}
workers: 24
schedule: {mode: task_major, seed: 732}
arms:
  - {name: small_only, llm: lite}                                           # routing reference (Flash-Lite alone, as C4)
  - {name: rt_assist, routing: {mode: assist}}
  - {name: rt_guard, routing: {mode: guard, tau: 0.5}}
