# Exploratory row E9, the check (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-07 "E9: cost-accuracy frontier"):
# GPT-6-Luna and GPT-6.1-Sol as multiple-choice deciders next to Jev and the two Gemini deciders on E1's development
# prefix ONLY (the 299 items of configs/eval/e1_dev_prefix_ids.json; excluded from C8 by A6.13). Same suites, item
# order and settings as E1 (configs/decision/bfcl_when2call.yaml); `--max-items 300` selects exactly the prefix
# (scripts/explore_e9_frontier.py checks the ids before any call). Descriptive; no test.
#   python scripts/explore_e9_frontier.py check --smoke      # 30 items, every backend, then the registered gate
#   python scripts/explore_e9_frontier.py check              # the 299 items (smoke answers replay from the cache)
name: e9_e1dev_check
suites:
  - {name: bfcl, categories: [simple_python, multiple, live_simple, live_multiple, irrelevance, live_irrelevance], max_per_cat: 200}
  - {name: when2call, max_items: 1000}
batch_by_state: true                 # one request per (state, decision point), as in E1
s1_cache: cache/s1_e9.sqlite         # new: every row is measured in this session (the smoke's answers replay in the full run)
workers: 4
backends:
  jev: {type: jev, provider: openrouter}                       # the author's Jev-only key, read by decision/jev.py only
  gemini_flash_typed: {type: s2_self, llm: {provider: gemini, model: gemini-3.5-flash}, reasoning_effort: minimal}
  gemini_lite_dist: {type: llm_generative, llm: {provider: gemini, model: gemini-3.5-flash-lite}, reasoning_effort: minimal, mode: distribution}
  luna_dist: {type: llm_generative, llm: {provider: openai_responses, model: gpt-6-luna}, reasoning_effort: none, mode: distribution}
  sol_dist: {type: llm_generative, llm: {provider: openai_responses, model: gpt-6.1-sol}, reasoning_effort: low, mode: distribution}
