# Exploratory row E27 (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-09 "E27: a 0.8B decision model that holds under
# shift"; descriptive, outside every Holm table). The gated final harness in-domain (registration (f) 7): AgentDecision-0.8B at its in-domain fitted thresholds (profile explore_e27_final.yaml), the 200 tasks of the dedicated final-harness rows (seeds 300500-300699; JEV_EVAL_RUNS=1), 1 worker, task-major seed 732, the model alone on the GPU; paired with runs/harness_final_dedicated's llm_only row.
# Flash on the direct Gemini API (temperature 0, minimal reasoning); on the E27 GPU host (scripts/aws/e27_small_shift.sh),
# the model behind serve_jev --backend clef on :8083 (engine v1, no System-1 cache); the Gemini key from SSM into the live
# process only. Run with scripts/explore_e27_small_shift.py's pause rule (probe-gated, paused on 503 / overload, capped).
name: e27_final_in
suite:
  name: jevgym
  n: 200
  seed0: 300500
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 200
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1_backends:
  e27:
    type: jev
    name: e27-sel
    base_url: http://127.0.0.1:8083
    model: e27-sel
    api_key: ''
    price_model: jevagentrl-4b
    timeout: 120.0
    cache: null
workers: 1
schedule:
  mode: task_major
  seed: 732
arms:
- name: e27_final_in
  s1: e27
  profile: configs/harness/explore_e27_final.yaml
  profile_s2: gemini-3.5-flash
  profile_backend: e27
