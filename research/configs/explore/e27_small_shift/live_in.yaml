# Exploratory row E27 (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-09 "E27: a 0.8B decision model that holds under
# shift"; descriptive, outside every Holm table). L3 in-domain (registration (f) 5): AgentDecision-0.8B (the selected arm, served as e27-sel) REPLACE at the tool choice on the first 200 fresh Stage-2 tasks (seeds 300000-300199; JEV_EVAL_RUNS=1), as E14's live_a.
