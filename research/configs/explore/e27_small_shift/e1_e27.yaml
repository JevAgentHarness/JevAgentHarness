# Exploratory row E27 (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-09 "E27" (e) 1; descriptive): E1's 3,991 static
# decisions answered by the two E27 arms (Qwen3.5-0.8B + a Clef head), each served by serve_jev --backend clef on :8083,
# one arm at a time. E14's E1 config (configs/explore/e14_small/e1_e14.yaml: E1's pools, exclusions, batching and
# workers) with the two arms and a new answer cache; cost per decision by E9's rule.
#   python -m jevharness.bench.decision_eval configs/explore/e27_small_shift/e1_e27.yaml --out runs --only e27s
name: e1_bfcl_when2call_e27
suites:
- name: bfcl
  categories:
  - simple_python
  - multiple
  - live_simple
  - live_multiple
  - irrelevance
  - live_irrelevance
  max_per_cat: 200
- name: when2call
  max_items: 1000
exclude_ids_file: configs/eval/e1_dev_prefix_ids.json
batch_by_state: true
s1_cache: cache/s1_e27_e1.sqlite
workers: 4
backends:
  e27s:
    type: jev
    name: e27-s
    base_url: http://127.0.0.1:8083
    model: e27-s
    api_key: ''
    timeout: 120.0
    price_model: jevagentrl-4b
  e27sp:
    type: jev
    name: e27-sp
    base_url: http://127.0.0.1:8083
    model: e27-sp
    api_key: ''
    timeout: 120.0
    price_model: jevagentrl-4b
