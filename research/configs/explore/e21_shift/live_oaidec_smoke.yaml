# Exploratory row E21, DecisionGym-Shift (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-08 "E21: a shifted DecisionGym
# split"; descriptive, outside every Holm table). Smoke of the Decisions API live row on 2 development tasks (seeds 339004-339005, never reported).
# Suite: the Stage-2 block with `shift: true` (surface, distraction and structure all on: 120 distractors, 40 noise
# lines, kinds by seed mod 10; src/jevharness/bench/suites/jevgym_shift.py). Flash on the direct Gemini API (temperature
# 0, minimal reasoning). Run with scripts/explore_e21_shift.py's pause rule (probe-gated, paused on 503 / overload,
# spend-capped). From this container only (the OpenAI key never goes to AWS).
name: e21_live_oaidec_smoke
suite:
  name: jevgym
  shift: true
  n: 2
  seed0: 339004
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 2
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1_cache: cache/s1_e21_live_oaidec_smoke.sqlite
s1_backends:
  oaidec:
    type: openai_decisions
    model: gpt-6-luna
    timeout: 120.0
workers: 2
arms:
- name: oaidec_ts_replace_f
  s1: oaidec
  tool_select:
    mode: replace
