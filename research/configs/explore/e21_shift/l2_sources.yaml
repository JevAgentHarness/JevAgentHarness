# Exploratory row E21, DecisionGym-Shift (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-08 "E21: a shifted DecisionGym
# split"; descriptive, outside every Holm table). L2 source runs (registration (d) 1): LLM-only and Jev REPLACE at the tool choice on the 100 L2 tasks (seeds
# 330000-330099; JEV_EVAL_RUNS=1); the corpus is built from these trajectories as C was.
# Suite: the Stage-2 block with `shift: true` (surface, distraction and structure all on: 120 distractors, 40 noise
# lines, kinds by seed mod 10; src/jevharness/bench/suites/jevgym_shift.py). Flash on the direct Gemini API (temperature
# 0, minimal reasoning). Run with scripts/explore_e21_shift.py's pause rule (probe-gated, paused on 503 / overload,
# spend-capped). From this container only: Jev with the Jev-only key, which never goes to AWS.
name: e21_l2
suite:
  name: jevgym
  shift: true
  n: 100
  seed0: 330000
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 100
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1:
  type: jev
  provider: openrouter
s1_cache: cache/s1_e21_l2.sqlite
workers: 4
schedule:
  mode: task_major
  seed: 732
arms:
- name: llm_only
- name: jev_ts_replace_f
  tool_select:
    mode: replace
