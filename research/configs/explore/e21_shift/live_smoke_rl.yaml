# Exploratory row E21, DecisionGym-Shift (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-08 "E21: a shifted DecisionGym
# split"; descriptive, outside every Holm table). Smoke of the rl live row on 2 development tasks (seeds 339006-339007, never reported).
# Suite: the Stage-2 block with `shift: true` (surface, distraction and structure all on: 120 distractors, 40 noise
# lines, kinds by seed mod 10; src/jevharness/bench/suites/jevgym_shift.py). Flash on the direct Gemini API (temperature
# 0, minimal reasoning). Run with scripts/explore_e21_shift.py's pause rule (probe-gated, paused on 503 / overload,
# spend-capped). On the E21 GPU host (scripts/aws/e21_shift.sh): AgentDecision-4B (the frozen JevAgentRL-4B checkpoint) behind serve_jev on :8081; the Gemini key from SSM into the live process only.
name: e21_live_smoke_rl
suite:
  name: jevgym
  shift: true
  n: 2
  seed0: 339006
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 2
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1_cache: cache/s1_e21_live_smoke_rl.sqlite
s1_backends:
  rl:
    type: jev
    name: jevagentrl-4b
    base_url: http://127.0.0.1:8081
    model: jevagentrl-4b
    api_key: ''
    price_model: jevagentrl-4b
    timeout: 60.0
workers: 2
arms:
- name: rl_ts_replace_f
  s1: rl
  tool_select:
    mode: replace
