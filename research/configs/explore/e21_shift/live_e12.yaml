# Exploratory row E21, DecisionGym-Shift (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-08 "E21: a shifted DecisionGym
# split"; descriptive, outside every Holm table). L3 (registration (e)): e12 REPLACE at the tool choice on the 200 L3 tasks (seeds 330100-330299;
# JEV_EVAL_RUNS=1).
# Suite: the Stage-2 block with `shift: true` (surface, distraction and structure all on: 120 distractors, 40 noise
# lines, kinds by seed mod 10; src/jevharness/bench/suites/jevgym_shift.py). Flash on the direct Gemini API (temperature
# 0, minimal reasoning). Run with scripts/explore_e21_shift.py's pause rule (probe-gated, paused on 503 / overload,
# spend-capped). On the E21 GPU host (scripts/aws/e21_shift.sh): E12 (AgentDecision-4B + public tool-use data) behind serve_jev on :8081; the Gemini key from SSM into the live process only.
name: e21_live_e12
suite:
  name: jevgym
  shift: true
  n: 200
  seed0: 330100
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 200
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1_cache: cache/s1_e21_live_e12.sqlite
s1_backends:
  e12:
    type: jev
    name: agentdecision-4b-mixed
    base_url: http://127.0.0.1:8081
    model: agentdecision-4b-mixed
    api_key: ''
    price_model: jevagentrl-4b
    timeout: 60.0
workers: 4
arms:
- name: e12_ts_replace_f
  s1: e12
  tool_select:
    mode: replace
