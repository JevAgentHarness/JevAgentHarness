# Exploratory row E21, addendum "E21 addendum 2: the untrained and SFT rows on the shift" (docs/PREREG_A7_STAGE2.md, Deviations
# 2026-10-09; descriptive, outside every Holm table). L3 (E21 (e) unchanged): base REPLACE at the tool choice on the 200 L3 tasks (seeds 330100-330299; JEV_EVAL_RUNS=1).
# As E21 (e): the Stage-2 block with `shift: true`, Flash on the direct Gemini API (temperature 0, minimal reasoning),
# REPLACE at the tool choice, the model served as for its E21 L2 replay (backends.yaml), a new System-1 cache.
# On the E21 GPU host (scripts/aws/e21_shift.sh stage l_base): the untrained Qwen3-4B (no adapter, results/gpu_round5/base_calibration.json) behind serve_jev on :8081; the Gemini key from SSM into the live process only.
name: e21_live_base
suite:
  name: jevgym
  shift: true
  n: 200
  seed0: 330100
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 200
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1_cache: cache/s1_e21_live_base.sqlite
s1_backends:
  base:
    type: jev
    name: rl-base
    base_url: http://127.0.0.1:8081
    model: rl-base
    api_key: ''
    price_model: jevagentrl-4b
    timeout: 60.0
workers: 4
arms:
- name: base_ts_replace_f
  s1: base
  tool_select:
    mode: replace
