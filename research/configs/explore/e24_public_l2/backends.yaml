    api_key: ''
    price_model: jevagentrl-4b
    timeout: 60.0
  e14a:
    type: jev
    name: e14-a
    base_url: http://127.0.0.1:8083
    model: e14-a
    api_key: ''
    price_model: jevagentrl-4b
    timeout: 120.0
  sl4b:
    type: jev
    name: startlux-4b
    base_url: http://127.0.0.1:8090
