# E6e smoke (development only, never reported as a result): every E6e arm on 2 development JevGym tasks (seeds 900,
# 901; outside every reserved range), the same settings and route as eval.yaml. Its mean $ per episode per arm gives
# the cost projection of the Deviations entry (scripts/explore_e6e_modes.py project).
name: e6e_modes_smoke
suite: {name: jevgym, n: 2, seed0: 900, families: v2, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}
n_tasks: 2
llm: {provider: openrouter, model: google/gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
small_llm: {provider: gemini, model: gemini-3.5-flash-lite, temperature: 0, reasoning_effort: minimal}   # routing only
llms:
  lite: {provider: gemini, model: gemini-3.5-flash-lite, temperature: 0, reasoning_effort: minimal}
s1: {type: jev, provider: openrouter}      # the pinned Jev endpoint of Stage 1; no System-1 cache (fresh answers)
workers: 8
schedule: {mode: task_major, seed: 732}
arms:
  - {name: llm_only}                                                        # reference of every cell but routing
  - {name: small_only, llm: lite}                                           # routing reference (Flash-Lite alone, as C4)
  # replace: System-1's argmax alone (p_yes >= 0.5; memory read: its single top memory, or none)
  - {name: mw_replace, memory_write: {mode: replace}, memory_read: {mode: always}}
  - {name: mr_replace, memory_write: {mode: always}, memory_read: {mode: replace}}
  - {name: rf_replace, reflection: {mode: replace}}
  - {name: st_replace, stop: {mode: replace}}
  - {name: rt_replace, routing: {mode: replace}}
