# E6c smoke (development only; cost projection): both eval arms on the first 2 games (stratified order) of E6a's 48
# calibration TRAIN games (data/raw/alfworld_e6a on the box). Never valid_seen. Settings copied from eval.yaml.
#   python -m jevharness.bench.runner configs/explore/e6c_alfworld/smoke.yaml --out runs
name: e6c_alfworld_smoke
suite: {name: alfworld, split: train, data_dir: data/raw/alfworld_e6a, n: 2, stratify: true, max_episode_steps: 50}
n_tasks: 2
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
s1: {type: jev, provider: openrouter}
harness_defaults: {max_steps: 50, history_window: 12}
workers: 16
schedule: {mode: task_major, seed: 732}
arms:
  - {name: llm_only}
  - {name: jev_action_guard, action: {mode: guard, tau: 0.5}}
