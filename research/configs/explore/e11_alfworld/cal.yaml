# E11 (exploratory, descriptive; docs/PREREG_A7_STAGE2.md, Deviations 2026-10-07 "E11"), threshold (g): the CASCADE
# threshold's calibration shadow arm on E6a's 48 ALFWorld TRAIN calibration games (configs/explore/e6a_alfworld/
# train_games.json; never harvested, never valid_seen). Flash acts at every step; the trained model (e11-alfworld-4b,
# training/serve_jev.py on :8081 of the E11 host) is asked the same action question and logged (measurement only, out
# of the episode cost). Fit: python scripts/explore_e11_alfworld.py fit  (-> tauhat_action.json).
#   python -m jevharness.bench.runner configs/explore/e11_alfworld/cal.yaml --out runs
name: e11_alfworld_cal
suite: {name: alfworld, split: train, data_dir: data/raw/alfworld_e6a, stratify: true, max_episode_steps: 50}
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
s1_backends:
  e11: {type: jev, name: e11-alfworld-4b, base_url: "http://127.0.0.1:8081", model: e11-alfworld-4b, api_key: "",
        timeout: 60.0, cache: null}
harness_defaults: {max_steps: 50, history_window: 12}
workers: 8
arms:
  - {name: e11_action_shadow_cal, s1: e11, action: {mode: shadow}}
