# E11 (exploratory, descriptive; docs/PREREG_A7_STAGE2.md, Deviations 2026-10-07 "E11: the training recipe on
# ALFWorld"), evaluation (h): E6a's 140 valid_seen games (configs/explore/e6a_alfworld/eval_games.json, stratified
# order) with E6a's settings; llm_only is re-run in the same pool (paired wall-clock). e11_action_cascade_tauhat: the
# trained model (e11-alfworld-4b: Qwen3-4B + LoRA, SFT on ALFWorld train states; serve_jev on :8081 with its fitted
# temperatures) at the action point in CASCADE at tau-hat (pending until `explore_e11_alfworld.py set-tau` writes the
# fit of cal.yaml, that one line only); e11_action_replace: the trained model alone (secondary, descriptive). One
# invocation, task-major interleaved (seed 732, 8 workers); passes 2-3 re-run infrastructure errors only. No System-1
# cache (honest wall time).
#   python -m jevharness.bench.runner configs/explore/e11_alfworld/eval.yaml --out runs
name: e11_alfworld_eval
suite: {name: alfworld, split: eval_in_distribution, data_dir: data/raw/alfworld, n: 140, stratify: true,
        max_episode_steps: 50}
n_tasks: 140
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
s1_backends:
  e11: {type: jev, name: e11-alfworld-4b, base_url: "http://127.0.0.1:8081", model: e11-alfworld-4b, api_key: "",
        timeout: 60.0, cache: null}
harness_defaults: {max_steps: 50, history_window: 12}
workers: 8
schedule: {mode: task_major, seed: 732}
arms:
  - {name: llm_only}
  - {name: e11_action_cascade_tauhat, s1: e11, action: {mode: cascade, tau: 0.120764}}
  - {name: e11_action_replace, s1: e11, action: {mode: replace}}
