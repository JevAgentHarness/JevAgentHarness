# E11 (exploratory, descriptive; docs/PREREG_A7_STAGE2.md, Deviations 2026-10-07 "E11: the training recipe on
# ALFWorld"), harvest (c) 1: the agent's own trajectories on ALFWorld TRAIN games (never valid_seen / valid_unseen).
# LLM-only Flash, one episode on each of the 360 Flash harvest games of harvest_games.json (extracted alone to
# data/raw/alfworld_e11_flash by `scripts/explore_e11_alfworld.py select`), with E6a's settings. Labels for training
# come from the logged gold next action, never from Flash's action.
#   python -m jevharness.bench.runner configs/explore/e11_alfworld/harvest_flash.yaml --out runs
name: e11_harvest_flash
suite: {name: alfworld, split: train, data_dir: data/raw/alfworld_e11_flash, stratify: true, max_episode_steps: 50}
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
harness_defaults: {max_steps: 50, history_window: 12}
workers: 8
arms:
  - {name: llm_only}
