# Exploratory row E15 (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-07 "E15: more decision-model baselines" (c) 4;
# descriptive, outside every Holm table): the OpenAI Decisions API LIVE, as `jev_ts_replace_f` of
# configs/experiments/stage2_rl_states.yaml, the E2 ladder and E12: tool_select REPLACE, the same suite block, the first
# 200 fresh Stage-2 tasks (seeds 300000..300199; evaluation seeds: JEV_EVAL_RUNS=1), Flash on the direct Gemini API
# (temperature 0, minimal reasoning), workers 4, a new System-1 cache. Run from the coordinating container only (the
# OpenAI key never goes to AWS); probe-gated, paused on 503 / overload (registration (d)). A refused tool choice falls
# through to the LLM (harness/agent.py).
#   JEV_EVAL_RUNS=1 jevbench run configs/explore/e15_baselines/live_oaidec.yaml --out runs
name: e15_live_oaidec
suite: {name: jevgym, n: 500, seed0: 300000, families: v2, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}   # Stage-2 fresh seeds (A7.2 (a))
n_tasks: 200
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
s1_cache: cache/s1_e15_live_oaidec.sqlite
s1_backends:
  oaidec: {type: openai_decisions, model: gpt-6-luna, timeout: 120.0}
workers: 4
arms:
  - {name: oaidec_ts_replace_f, s1: oaidec, tool_select: {mode: replace}}
