# E15 live smoke (development only, never reported): live_oaidec.yaml on 2 JevGym development tasks (seeds 906-907: the
# pilot / development range 0-999, outside every evaluation, calibration and training block), the same arm, backend,
# LLM and suite options; it feeds the registered cost gate (scripts/explore_e15_baselines.py gate).
name: e15_live_smoke_oaidec
suite: {name: jevgym, n: 2, seed0: 906, families: v2, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}   # development seeds (never reported)
n_tasks: 2
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
s1_cache: cache/s1_e15_live_smoke.sqlite
s1_backends:
  oaidec: {type: openai_decisions, model: gpt-6-luna, timeout: 120.0}
workers: 2
arms:
  - {name: oaidec_ts_replace_f, s1: oaidec, tool_select: {mode: replace}}
