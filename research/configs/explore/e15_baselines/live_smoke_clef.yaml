# Exploratory row E15 (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-07 "E15: more decision-model baselines" (c) 4;
# descriptive, outside every Holm table): Clef 27B (8-bit) LIVE, as `jev_ts_replace_f` of configs/experiments/stage2_rl_states.yaml,
# the E2 ladder and E12: tool_select REPLACE, the same suite block, 2 JevGym development tasks (seeds 906-907, never reported; the cost gate's smoke), Flash on the direct Gemini API (temperature 0,
# minimal reasoning), a new System-1 cache. Written by `scripts/explore_e15_baselines.py livecfg --slug clef` from the
# model's L1 backend (configs/explore/e15_baselines/e1_e15.yaml); served on :8090 of the E15 host (scripts/aws/e15_baselines.sh live_clef); probe-gated, paused on 503 / overload.
name: e15_live_smoke_clef
suite:
  name: jevgym
  n: 2
  seed0: 906
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 2
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1_cache: cache/s1_e15_live_smoke_clef.sqlite
s1_backends:
  clef:
    type: jev
    name: clef
    base_url: http://127.0.0.1:8090
    model: clef
    api_key: ''
    timeout: 600.0
    price_model: e15-selfhost
workers: 2
arms:
- name: clef_ts_replace_f
  s1: clef
  tool_select:
    mode: replace
