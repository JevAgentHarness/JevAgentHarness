# Exploratory row E20 (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-08 "E20: decision-model ensembles and a hosted
# decision API behind the gate" (b), (d); descriptive, outside every Holm table): the final harness with
# (i) the OpenAI Decisions API (gpt-6-luna) behind the cascade
# as System-1: tool + argument cascade at the thresholds fitted in E20 (c) (configs/harness/explore_e20_final.yaml,
# backends.oaidec), reflection off, argument questions batched per step; Gemini 3.5 Flash on the direct Gemini API.
# Run from the coordinating container only (no GPU; the OpenAI key and OPENROUTER_API_KEY_JEV never leave it);
# the 200 tasks of the logged dedicated final-harness rows (runs/harness_final_dedicated: seeds 300500-300699, 1 worker,
# task-major schedule seed 732, no System-1 cache); ONLY the new arm runs (reference: the logged llm_only row, not re-run).
#   JEV_EVAL_RUNS=1 jevbench run configs/explore/e20_ensembles/live_oaidec.yaml --out runs
name: e20_live_oaidec
suite:
  name: jevgym
  n: 200
  seed0: 300500
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 200
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1_backends:
  oaidec:
    type: openai_decisions
    model: gpt-6-luna
    timeout: 120.0
    cache: null
workers: 1
schedule:
  mode: task_major
  seed: 732
arms:
- name: oaidec_final
  s1: oaidec
  profile: configs/harness/explore_e20_final.yaml
  profile_s2: gemini-3.5-flash
  profile_backend: oaidec
