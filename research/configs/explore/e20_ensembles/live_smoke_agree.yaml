# Exploratory row E20 (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-08 "E20: decision-model ensembles and a hosted
# decision API behind the gate" (b), (d); descriptive, outside every Holm table): the final harness with
# (ii) an agreement gate of Jev (OpenRouter, the Jev-only key) and the OpenAI Decisions API
# as System-1: tool + argument cascade at the thresholds fitted in E20 (c) (configs/harness/explore_e20_final.yaml,
# backends.agree), reflection off, argument questions batched per step; Gemini 3.5 Flash on the direct Gemini API.
# Run from the coordinating container only (no GPU; the OpenAI key and OPENROUTER_API_KEY_JEV never leave it);
# the smoke: 2 JevGym development tasks (seeds 914-915, never reported).
#   jevbench run configs/explore/e20_ensembles/live_smoke_agree.yaml --out runs
name: e20_live_smoke_agree
suite:
  name: jevgym
  n: 2
  seed0: 914
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 2
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
s1_backends:
  agree:
    type: ensemble
    name: agree
    rule: agree
    members:
    - {type: jev, provider: openrouter, timeout: 120.0}
    - {type: openai_decisions, model: gpt-6-luna, timeout: 120.0}
    member_names: [jev, oaidec]
    cache: null
workers: 1
schedule:
  mode: task_major
  seed: 732
arms:
- name: agree_final
  s1: agree
  profile: configs/harness/explore_e20_final.yaml
  profile_s2: gemini-3.5-flash
  profile_backend: agree
