# E19 extension (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-08 "E19 extension: the remaining 20 tasks"; exploratory,
# descriptive, no test, outside every Holm table): the remaining registered E19 seeds 310780-310799 (n = 20), so that E19
# covers E7f's whole block (200 tasks with the first part's 310600-310779, which the registered gate chose at the $56
# cap; the total cap is $62). Everything else is eval_e19.yaml unchanged: the same arm, checkpoint (served as
# agentdecision-4b-random on :8081), thresholds, setting, route and workers. No smoke: the gate projects from the first
# part's logged costs. Run by scripts/aws/e7_hard.sh with EXP=e19x:
#   JEV_EVAL_RUNS=1 jevbench run configs/explore/e7_hard/eval_e19x.yaml --out runs -o workers=12
name: e19x_hard
suite: {name: jevgym, n: 20, seed0: 310780, families: multi, multi_customers: 12, multi_rule: tier, answer_style: itemized, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}
n_tasks: 20
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
harness_defaults: {max_steps: 45}
s1_backends:
  agentdecision_random: {type: jev, name: agentdecision-4b-random, base_url: "http://127.0.0.1:8081", model: agentdecision-4b-random,
                         api_key: "", timeout: 60.0, cache: null}
workers: 12
schedule: {mode: task_major, seed: 732}
arms:
  # E19's fit (registered calibration-arm estimator, calibration seeds 5300-5319, this model's own answers): tool choice
  # 0.9999538704122877, arguments 0.9862272143363953; the profile's fixed reflection trigger (0.5) asks the same model
  - {name: rl_random, s1: agentdecision_random, tool_select: {mode: cascade, tau: 0.9999538704122877}, tool_params: {mode: cascade, tau: 0.9862272143363953}, reflection: {mode: trigger, tau: 0.5}}
