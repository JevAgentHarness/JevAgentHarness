# E19 smoke (development only, never reported): the one arm on 2 development tasks (seeds 7284, 7285; never run before),
# the same settings as eval_e19.yaml; its mean $ per episode gives the row's projection
# (scripts/explore_e19_hard_random.py project; the gate of Deviations "E19" (i)).
name: e19_hard_smoke
suite: {name: jevgym, n: 2, seed0: 7284, families: multi, multi_customers: 12, multi_rule: tier, answer_style: itemized, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}
n_tasks: 2
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
harness_defaults: {max_steps: 45}
s1_backends:
  agentdecision_random: {type: jev, name: agentdecision-4b-random, base_url: "http://127.0.0.1:8081", model: agentdecision-4b-random,
                         api_key: "", timeout: 60.0, cache: null}
workers: 12
schedule: {mode: task_major, seed: 732}
arms:
  # E19's fit (registered calibration-arm estimator, calibration seeds 5300-5319, this model's own answers): tool choice
  # 0.9999538704122877, arguments 0.9862272143363953; the profile's fixed reflection trigger (0.5) asks the same model
  - {name: rl_random, s1: agentdecision_random, tool_select: {mode: cascade, tau: 0.9999538704122877}, tool_params: {mode: cascade, tau: 0.9862272143363953}, reflection: {mode: trigger, tau: 0.5}}
