# E7c smoke (development only, never reported as a result): the three E7c arms on 2 development tasks (seeds 7294,
# 7295; unused by the pilot, the route check and the E7 / E7b smokes), the same settings as eval_c.yaml (the fitted
# thresholds are written into both files together). Its mean $ per episode per arm gives E7c's projection.
name: e7c_hard_smoke
suite: {name: jevgym, n: 2, seed0: 7294, families: multi, multi_customers: 12, multi_rule: tier, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}
n_tasks: 2
llm: {provider: openrouter, model: google/gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
harness_defaults: {max_steps: 45}
s1: {type: jev, provider: openrouter}
s1_backends:
  jevagent_rl: {type: jev, name: jevagentrl-4b, base_url: "http://127.0.0.1:8081", model: jevagentrl-4b, api_key: "",
                timeout: 60.0, cache: null}
workers: 12
schedule: {mode: task_major, seed: 732}
arms:
  - {name: llm_only}
  # tau-hat refitted on the E7c calibration arm (results/explore/e7_hard/cal_e7c/fits.json; Deviations "E7c: the fitted thresholds")
  - {name: jev_refit, tool_select: {mode: cascade, tau: 0.91}, tool_params: {mode: cascade, tau: 0.87}, reflection: {mode: trigger, tau: 0.5}}
  # the 4B's tool_select fit accepts no confidence level: always defer (A6.11 (c): System-1 not asked there); tool_params
  # tau-hat 1.0 is reached only inside System-1-chosen calls, so it never fires (as A6.11 (c) states for C1L)
  - {name: rl_refit, s1: jevagent_rl, tool_select: {mode: cascade, tau: 1.0, always_defer: true}, tool_params: {mode: cascade, tau: 1.0}, reflection: {mode: trigger, tau: 0.5}}
