# Exploratory row E7, JevGym-Hard (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-06 "Exploratory row E7 (JevGym-Hard)";
# descriptive, no test, outside every Holm table). Fresh seeds 310000-310199 (n = 200; the runner refuses them without
# JEV_EVAL_RUNS=1, bench/registry.py EXPLORE_EVAL_RANGES). The setting was chosen on development seeds 7000-7299 only
# (results/explore/e7_hard/pilot.{json,md}): multi tasks only, K customers per task under the `tier` order policy
# (bench/suites/jevgym.py multi_rule), otherwise the Stage-2 suite settings (60 near distractors, 20 noise lines, strict).
# System-2: Gemini 3.5 Flash via OpenRouter (temperature 0, minimal reasoning); the direct API answered 503 "high
# demand" on 2026-10-06 15:00 UTC. Decision models: Jev via OpenRouter (the Stage-1 pinned endpoint; no cache) and the
# frozen JevAgentRL-4B (results/stage2/rl_eval_plan.json row `frozen`, sha256-checked) behind training/serve_jev.py with
# the plan's serve_args (S2-4's server) on the E7 GPU host; no System-1 cache. One pool, task-major (arm order seeded
# per task, seed 732), 12 workers (about four JevAgentRL episodes in flight, S2-4's tariff concurrency); three passes,
# passes 2-3 re-run infrastructure errors only (scripts/aws/e7_hard.sh eval):
#   JEV_EVAL_RUNS=1 jevbench run configs/explore/e7_hard/eval.yaml --out runs -o workers=12
name: e7_hard
suite: {name: jevgym, n: 200, seed0: 310000, families: multi, multi_customers: 10, multi_rule: tier, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}
n_tasks: 200
llm: {provider: openrouter, model: google/gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
harness_defaults: {max_steps: 45}
s1: {type: jev, provider: openrouter}        # the pinned Jev endpoint of Stage 1; no System-1 cache (fresh answers)
s1_backends:
  jevagent_rl: {type: jev, name: jevagentrl-4b, base_url: "http://127.0.0.1:8081", model: jevagentrl-4b, api_key: "",
                timeout: 60.0, cache: null}
workers: 12
schedule: {mode: task_major, seed: 732}
arms:
  - {name: llm_only}
  # the Stage-2 Jev profile exactly as frozen (tool cascade at the Stage-1 fitted tau-hat* + reflection trigger)
  - {name: jevagent_best, profile: configs/harness/jevagent_best.yaml, profile_s2: gemini-3.5-flash}
  # the same profile on the frozen JevAgentRL-4B at its frozen thresholds (the profile's backends.jevagent_rl block)
  - {name: jevagent_best_rl, s1: jevagent_rl, profile: configs/harness/jevagent_best.yaml, profile_s2: gemini-3.5-flash, profile_backend: jevagent_rl}
