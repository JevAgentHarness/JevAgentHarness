# E7f extension (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-07 "E7f extension"; exploratory, descriptive, no test,
# outside every Holm table): the remaining registered E7f seeds 310680-310799 (n = 120), so that E7f covers its whole
# reserved block (200 tasks with the first part's 310600-310679). Everything else is eval_e7f.yaml unchanged: the same
# two arms, checkpoint (AgentDecision-4B (tier) served as agentdecision-4b-tier on :8081), thresholds, setting, route and
# workers. No smoke: the gate projects from the first part's logged costs. Run by scripts/aws/e7_hard.sh with EXP=e7fx:
#   JEV_EVAL_RUNS=1 jevbench run configs/explore/e7_hard/eval_e7fx.yaml --out runs -o workers=12
name: e7fx_hard
suite: {name: jevgym, n: 120, seed0: 310680, families: multi, multi_customers: 12, multi_rule: tier, answer_style: itemized, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}
n_tasks: 120
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
harness_defaults: {max_steps: 45}
s1_backends:
  agentdecision_tier: {type: jev, name: agentdecision-4b-tier, base_url: "http://127.0.0.1:8081", model: agentdecision-4b-tier,
                       api_key: "", timeout: 60.0, cache: null}
workers: 12
schedule: {mode: task_major, seed: 732}
arms:
  - {name: llm_only}
  # E7d's fit (registered calibration-arm estimator, calibration seeds 5300-5319): tool choice 0.9999322567940803,
  # arguments 0.9929112792015076; the profile's fixed reflection trigger (0.5) asks the same model
  - {name: rl_tier, s1: agentdecision_tier, tool_select: {mode: cascade, tau: 0.9999322567940803}, tool_params: {mode: cascade, tau: 0.9929112792015076}, reflection: {mode: trigger, tau: 0.5}}
