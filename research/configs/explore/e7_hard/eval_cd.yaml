# E7c, direct-API row (docs/PREREG_A7_STAGE2.md, Deviations 2026-10-06 "E7c direct-API row"; descriptive, no test,
# outside every Holm table): E7c's registered tasks (seeds 310400-310599, n = 200; 12 customers, tier rule) and two of its
# arms, run with Flash on the DIRECT Gemini API because the org's OpenRouter budget is exhausted (HTTP 403 since about
# 19:05 UTC). jev_refit is not run: Jev is reachable only through OpenRouter. Both arms use the same route, so success and
# cost compare within this row only. rl_refit = the 4B profile at the thresholds refitted on E7c's calibration arm
# (results/explore/e7_hard/cal_e7c/fits.json; the calibration ran on the OpenRouter route; the thresholds are unchanged).
#   JEV_EVAL_RUNS=1 jevbench run configs/explore/e7_hard/eval_cd.yaml --out runs -o workers=24     (EXP=e7cd)
name: e7cd_hard
suite: {name: jevgym, n: 200, seed0: 310400, families: multi, multi_customers: 12, multi_rule: tier, distractor_style: near, n_distractors: 60, noise_lines: 20, strict: true}
n_tasks: 200
llm: {provider: gemini, model: gemini-3.5-flash, temperature: 0, reasoning_effort: minimal}
harness_defaults: {max_steps: 45}
s1_backends:
  jevagent_rl: {type: jev, name: jevagentrl-4b, base_url: "http://127.0.0.1:8081", model: jevagentrl-4b, api_key: "",
                timeout: 60.0, cache: null}
workers: 24
schedule: {mode: task_major, seed: 732}
arms:
  - {name: llm_only}
  # the 4B's tool_select fit accepts no confidence level: always defer (A6.11 (c): System-1 not asked there); tool_params
  # tau-hat 1.0 is reached only inside System-1-chosen calls, so it never fires; the reflection trigger (0.5) asks the 4B
  - {name: rl_refit, s1: jevagent_rl, tool_select: {mode: cascade, tau: 1.0, always_defer: true}, tool_params: {mode: cascade, tau: 1.0}, reflection: {mode: trigger, tau: 0.5}}
