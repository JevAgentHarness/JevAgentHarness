name: e2a_jevgym_shadow_cal
suite:
  name: jevgym
  n: 150
  seed0: 5000
  families: v2
  distractor_style: near
  n_distractors: 60
  noise_lines: 20
  strict: true
n_tasks: 150
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0
  reasoning_effort: minimal
llms:
  lite2:
    provider: gemini
    model: gemini-3.5-flash-lite
    temperature: 0
    reasoning_effort: minimal
s1:
  type: jev
  provider: openrouter
s1_cache: cache/s1.sqlite
workers: 8
arms:
- name: jev_shadow_cal
  tool_select:
    mode: shadow
  tool_params:
    mode: shadow
  stop:
    mode: shadow
- name: jev_shadow_cal_s2lite
  llm: lite2
  tool_select:
    mode: shadow
  tool_params:
    mode: shadow
  stop:
    mode: shadow
