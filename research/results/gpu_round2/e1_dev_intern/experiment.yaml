name: e1_dev_intern
suites:
- name: bfcl
  categories:
  - simple_python
  - multiple
  - live_simple
  - live_multiple
  - irrelevance
  - live_irrelevance
  max_per_cat: 200
- name: when2call
  max_items: 1000
batch_by_state: true
s1_cache: cache/s1.sqlite
fc_cache: cache/fc.sqlite
workers: 2
backends:
  jev:
    type: jev
    provider: openrouter
  intern08:
    type: intern_decision
    model: internlm/Intern-Decision-0.8B
  intern2b:
    type: intern_decision
    model: internlm/Intern-Decision-2B
  intern4b:
    type: intern_decision
    model: internlm/Intern-Decision-4B
  intern2b_uncal:
    type: intern_decision
    model: internlm/Intern-Decision-2B
    temperature: 1
  bm25:
    type: bm25
