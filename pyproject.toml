[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jevagentharness"
version = "0.1.0"
description = "An OpenAI-compatible proxy that routes each agent step between a strong and a fast LLM with a small decision model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "JevAgentHarness authors" }]
keywords = [
  "llm",
  "agents",
  "coding-agent",
  "routing",
  "model-routing",
  "decision-model",
  "openai-compatible",
  "proxy",
  "codex",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]
dependencies = ["aiohttp>=3.9", "pyyaml>=6.0"]

[project.optional-dependencies]
# The Terminal-Bench 2.0 harness in bench/ (Harbor 0.24.0 needs Python >= 3.12 and Docker).
bench = ["harbor==0.24.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
jah = "jevagentharness.cli:main"

[project.urls]
Homepage = "https://github.com/JevAgentHarness/JevAgentHarness"
Issues = "https://github.com/JevAgentHarness/JevAgentHarness/issues"
Paper = "https://github.com/JevAgentHarness/JevAgentHarness/blob/main/paper/JevAgentHarness.pdf"

[tool.hatch.build.targets.wheel]
packages = ["src/jevagentharness"]

[tool.hatch.build.targets.sdist]
exclude = ["paper/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
